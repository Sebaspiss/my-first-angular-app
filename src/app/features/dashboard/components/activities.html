<p-card class="border border-blue-600 shadow-sm w-full h-full">
  <ng-template #header>
    <header class="flex items-center justify-between p-4 border-b border-gray-100 bg-gray-50">
      <div class="flex items-center gap-2">
        <i class="pi pi-history text-purple-500 text-lg"></i>
        <div class="flex flex-col">
          <h2 class="font-bold text-gray-800 text-base">Recent Activities</h2>
          <p class="text-xs text-gray-500">History of recent transactions</p>
        </div>
      </div>
      <span class="text-xs text-gray-400 font-medium">Last 30 days</span>
    </header>
  </ng-template>

  <ul class="space-y-4 mt-2 list-none p-0">
    @for (activity of activitiesService.computedActivities(); track activity.id) {
      <li class="flex items-center justify-between p-2 hover:bg-gray-50 rounded-lg transition">
        <div class="flex items-center gap-3">
          <span [appActivityBadge]="activity.isBuy" aria-hidden="true">
            <i [appActivityIcon]="activity.isBuy"></i>
          </span>
          <div class="flex flex-col">
            <span class="text-sm font-semibold text-gray-800">{{ activity.title }}</span>
            <span class="text-xs text-gray-400">{{ activity.date }} • {{ activity.status }}</span>
          </div>
        </div>
        <div class="text-right">
          <span [appActivityAmount]="activity.isBuy">
            {{ activity.formattedAmount }}
          </span>
          <span class="text-[10px] block text-gray-400">Shares: {{ activity.shares }}</span>
        </div>
      </li>
    }
  </ul>
</p-card>
