<p-card class="border border-blue-600 shadow-sm w-full h-full">
  <ng-template #header>
    <header class="flex items-center justify-between p-4 border-b border-gray-100 bg-gray-50">
      <div class="flex items-center gap-2">
        <i class="pi pi-bookmark text-amber-500 text-lg"></i>
        <div class="flex flex-col">
          <h2 class="font-bold text-gray-800 text-base">Market News</h2>
          <span class="text-xs text-gray-500">Financial updates and promotions</span>
        </div>
      </div>
      <button class="text-xs text-blue-600 font-semibold cursor-pointer hover:underline">View all</button>
    </header>
  </ng-template>

  <ul class="space-y-4 mt-2 list-none p-0">
    @for (item of newsService.news(); track item.id) {
      <li class="flex flex-col gap-1 p-2 hover:bg-gray-50 rounded-lg transition cursor-pointer">
        <div class="flex items-center justify-between">
          <span [appNewsCategoryBadge]="item.category">{{ item.category }}</span>
          <span class="text-xs text-gray-400">{{ item.date }}</span>
        </div>
        <span class="text-sm font-semibold text-gray-800 leading-tight">{{ item.title }}</span>
        <span class="text-xs text-gray-500 line-clamp-1">{{ item.description }}</span>
      </li>
    }
  </ul>
</p-card>
