<form [formGroup]="anagraficaForm" (ngSubmit)="onSubmit()" class="space-y-6 px-5" novalidate>

  <!-- Sezione: Informazioni di base -->
  <fieldset class="border-0 p-0 m-0 space-y-4">
    <legend class="w-full mb-2">
      <p-divider>
        <h2 class="font-bold text-base text-blue-600 dark:text-blue-400 m-0 inline">Informazioni di Base</h2>
      </p-divider>
    </legend>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label for="nome" class="block mb-2 text-sm font-medium">Nome <span class="text-red-500" aria-hidden="true">*</span></label>
        <input 
          id="nome"
          pInputText
          class="w-full border border-gray-300 dark:border-gray-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
          type="text"
          formControlName="nome"
          autocomplete="nome"
          aria-required="true" />
      </div>

      <div>
        <label for="cognome" class="block mb-2 text-sm font-medium">Cognome <span class="text-red-500" aria-hidden="true">*</span></label>
        <input 
          id="cognome"
          pInputText
          class="w-full border border-gray-300 dark:border-gray-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
          type="text"
          formControlName="cognome"
          autocomplete="cognome"
          aria-required="true" />
      </div>

      <div>
        <label for="dataNascita" class="block mb-2 text-sm font-medium">Data di Nascita <span class="text-red-500" aria-hidden="true">*</span></label>
        <p-datepicker 
          inputId="dataNascita"
          class="w-full"
          formControlName="dataNascita"
          dateFormat="dd/mm/yy"
          aria-required="true"
          [pt]="{
            panel: { class: '!py-1.5' },
            header: { class: '!py-0.5 !mb-0' },
            dayView: { class: '!mt-0' },
            weekDay: { class: '!py-0.5 !text-xs' },
            day: { class: '!h-7 !text-xs' }
          }">
        </p-datepicker>
      </div>

      <div>
        <label for="genere" class="block mb-2 text-sm font-medium">Genere <span class="text-red-500" aria-hidden="true">*</span></label>
        <p-select 
          inputId="genere"
          class="w-full"
          [options]="generi"
          formControlName="genere" 
          placeholder="Seleziona genere"
          aria-required="true">
        </p-select>
      </div>
    </div>
  </fieldset>

  <!-- Sezione: Contatti -->
  <fieldset class="border-0 p-0 m-0 space-y-4">
    <legend class="w-full mb-2">
      <p-divider>
        <h2 class="font-bold text-base text-blue-600 dark:text-blue-400 m-0 inline">Contatti</h2>
      </p-divider>
    </legend>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label for="email" class="block mb-2 text-sm font-medium">Email <span class="text-red-500" aria-hidden="true">*</span></label>
        <input 
          id="email"
          pInputText
          class="w-full border border-gray-300 dark:border-gray-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
          type="email"
          formControlName="email"
          autocomplete="email"
          aria-required="true" />
      </div>

      <div>
        <label for="telefono" class="block mb-2 text-sm font-medium">Telefono</label>
        <input 
          id="telefono"
          pInputText
          class="w-full border border-gray-300 dark:border-gray-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
          type="tel"
          inputmode="tel"
          formControlName="telefono"
          autocomplete="tel" />
      </div>
    </div>
  </fieldset>

  <!-- Sezione: Indirizzo -->
  <fieldset class="border-0 p-0 m-0 space-y-4">
    <legend class="w-full mb-2">
      <p-divider>
        <h2 class="font-bold text-base text-blue-600 dark:text-blue-400 m-0 inline">Indirizzo</h2>
      </p-divider>
    </legend>

    <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
      <div class="md:col-span-12">
        <label for="via" class="block mb-2 text-sm font-medium">Via / Indirizzo</label>
        <input 
          id="via"
          pInputText
          class="w-full border border-gray-300 dark:border-gray-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
          type="text"
          formControlName="via"
          autocomplete="indirizzo" />
      </div>

      <div class="md:col-span-5">
        <label for="citta" class="block mb-2 text-sm font-medium">Città</label>
        <input 
          id="citta"
          pInputText
          class="w-full border border-gray-300 dark:border-gray-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
          type="text"
          formControlName="citta"
          autocomplete="città" />
      </div>

      <div class="md:col-span-3">
        <label for="cap" class="block mb-2 text-sm font-medium">CAP</label>
        <input 
          id="cap"
          pInputText
          class="w-full border border-gray-300 dark:border-gray-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
          type="text"
          inputmode="numeric"
          formControlName="cap"
          autocomplete="C.A.P." />
      </div>

      <div class="md:col-span-4">
        <label for="provincia" class="block mb-2 text-sm font-medium">Provincia</label>
        <input 
          id="provincia"
          pInputText
          class="w-full border border-gray-300 dark:border-gray-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
          type="text"
          formControlName="provincia"
          autocomplete="provincia" />
      </div>
    </div>
  </fieldset>

  <!-- Pulsante di submit -->
  <footer class="flex justify-center mt-12 mb-6">
    <p-button
      type="submit"
      label="Salva"
      severity="primary"
      styleClass="w-full md:w-64 py-2.5 text-base font-semibold shadow-md">
    </p-button>
  </footer>

</form>
