<section class="space-y-4">
  <p-card header="Selezione Documenti">
    <div class="flex justify-between items-center mb-3">
      <div class="text-sm text-gray-500">Seleziona i documenti da inviare o gestire</div>
      <button pButton label="Seleziona tutti" class="p-button-sm" (click)="selectAll()"></button>
    </div>

    <section class="space-y-2">

      @for (doc of data; track doc.id) {
        <div
          class="flex items-center justify-between p-3 rounded-lg border border-gray-200 hover:bg-gray-50 hover:border-blue-300 transition cursor-pointer"
          (click)="doc.selected = !doc.selected">

          <div class="flex items-center gap-3">
            <p-checkbox [(ngModel)]="doc.selected" [binary]="true" (click)="$event.stopPropagation()"></p-checkbox>
            <div class="flex flex-col">
              <div class="font-medium text-gray-800">{{ doc.name }}</div>
              <div class="text-xs text-gray-400">{{ doc.type }} • {{ doc.size }}</div>
            </div>
          </div>

          <div class="flex items-center gap-4">
            <span class="text-xs text-gray-500 hidden sm:inline">{{ doc.date }}</span>
            <button pButton icon="pi pi-eye" label="Apri" class="p-button-outlined p-button-sm cursor-pointer" (click)="openDocument(doc); $event.stopPropagation()"></button>
          </div>

        </div>
      }
    </section>

    <p-divider></p-divider>

    <div class="flex justify-between items-center text-sm text-gray-600">
      <div>Selezionati: {{ selectedCount }}</div>
    </div>
  </p-card>

  <!-- Document Viewer -->
  <p-dialog 
    [header]="selectedDocumentName" 
    [visible]="hasSelectedDocument" 
    (visibleChange)="closeDocument()" 
    [modal]="true" 
    [style]="{ width: '700px', maxHeight: '90vh' }"
    [draggable]="false"
    [resizable]="false">
    
    @if (selectedDocument) {
      <div class="p-4 bg-gray-50 dark:bg-gray-800 rounded-lg flex items-center justify-center min-h-[350px]">
        @switch (selectedDocument.type) {
          @case ('PDF') {
            <doc-pdf-preview [data]="documentService.getPdfPreview(selectedDocument.id)" />
          }
          @case ('Excel') {
            <doc-excel-preview [data]="documentService.getExcelPreview(selectedDocument.id)" />
          }
          @case ('Image') {
            <doc-image-preview [data]="documentService.getImagePreview(selectedDocument.id)" />
          }
        }
      </div>
    }

    <ng-template #footer>
      <div class="flex justify-between items-center w-full pt-2">
        <button pButton icon="pi pi-download" label="Scarica" class="p-button-sm cursor-pointer" 
          (click)="downloadDocument(selectedDocument)">
        </button>
        <button pButton icon="pi pi-times" label="Chiudi" class="p-button-outlined p-button-secondary p-button-sm cursor-pointer" 
          (click)="closeDocument()">
        </button>
      </div>
    </ng-template>
  </p-dialog>
</section>
