<section class="space-y-4" aria-label="Messages Section">
  <p-card header="Messages">
    <ul class="space-y-3 list-none p-0 m-0" role="list">
      @for (msg of data; track msg.id) {
        <li>
          <button 
            type="button"
            class="w-full text-left flex items-start justify-between p-3 rounded-lg border border-gray-200 hover:bg-gray-50 hover:border-blue-300 transition cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-400"
            (click)="openMessage(msg)"
            >
            <div class="flex flex-col gap-1 pr-2">
              <h3 class="font-semibold text-gray-800 text-sm m-0">{{ msg.title }}</h3>
              <p class="text-sm text-gray-500 m-0 line-clamp-2">{{ msg.preview }}</p>
              <time class="text-xs text-gray-400">{{ msg.date }}</time>
            </div>

            <p-badge [value]="msg.status" [severity]="messageSeverity(msg.status)" class="shrink-0"></p-badge>
          </button>
        </li>
      }
    </ul>
    
    <p-divider></p-divider>

    <footer class="text-right text-sm text-gray-500">
      Total messages: <output>{{ data.length }}</output>
    </footer>
  </p-card>

  <!-- Message Details -->
  <p-dialog 
    header="Message Details" 
    [visible]="hasSelectedMessage" 
    (visibleChange)="closeModal()" 
    [modal]="true" 
    [style]="{ width: '450px' }"
    [draggable]="false"
    [resizable]="false">
    
    @if (selectedMessage) {
      <article class="space-y-4 pt-3">
        <dl class="space-y-4 m-0">
          <div>
            <dt class="text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-1">Title</dt>
            <dd class="m-0">
              <h4 class="text-base font-bold text-gray-800 m-0">{{ selectedMessage.title }}</h4>
            </dd>
          </div>

          <p-divider></p-divider>

          <!-- Content -->
          <div>
            <dt class="text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-1">Content</dt>
            <dd class="m-0">
              <p class="text-sm text-gray-600 leading-relaxed whitespace-pre-line m-0">{{ selectedMessage.preview }}</p>
            </dd>
          </div>

          <p-divider></p-divider>

          <!-- Date and Status -->
          <div class="flex justify-between items-center text-xs">
            <div>
              <dt class="text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-1">Received Date</dt>
              <dd class="m-0">
                <time class="text-gray-500 font-medium">{{ selectedMessage.date }}</time>
              </dd>
            </div>
            
            <div class="text-right">
              <dt class="text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-1">Status</dt>
              <dd class="m-0">
                <span class="px-2 py-0.5 rounded-full font-bold text-[9px] uppercase inline-block"
                  [class.bg-red-100]="isNewMessage"
                  [class.text-red-700]="isNewMessage"
                  [class.bg-green-100]="isReadMessage"
                  [class.text-green-700]="isReadMessage">
                  {{ selectedMessage.status }}
                </span>
              </dd>
            </div>
          </div>
        </dl>
      </article>
    }

    <ng-template #footer>
      <div class="flex justify-end pt-2">
        <button pButton label="Close" icon="pi pi-times" (click)="closeModal()" class="p-button-sm cursor-pointer"></button>
      </div>
    </ng-template>
  </p-dialog>
</section>
