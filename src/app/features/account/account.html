<div class="px-5">
    <p-tabs [value]="activeTab">
        <p-tablist>
        @for (tab of tabs; track tab.route) {
            <p-tab [value]="tab.route" [routerLink]="tab.route" class="cursor-pointer">
                <i [class]="tab.icon" class="mr-2"></i>
                <span>{{ tab.label }}</span>
            </p-tab>
        }
        </p-tablist>
    </p-tabs>
</div>
<div class="mt-4">
    <router-outlet></router-outlet>
</div>
