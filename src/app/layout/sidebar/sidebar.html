<nav class="flex flex-col h-full bg-surface-0 border-r border-surface-200">
    <!-- Brand / Logo Header -->
    <header class="h-16 flex items-center px-4 border-b border-surface-200">
        <a routerLink="/dashboard" class="text-xl font-semibold text-blue-600 no-underline">
            Fintech Company
        </a>
    </header>
    
    <!-- Menu di navigazione -->
    <ul class="flex-1 px-3 py-4 space-y-1 list-none m-0 p-0">
        @for (item of menuItems; track item.route) {
            <li>
                <a [routerLink]="item.route" 
                    routerLinkActive="bg-blue-50/60 !text-blue-600 font-semibold"
                    class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-surface-700 hover:bg-surface-100 hover:text-surface-900 transition group"
                >
                    <i appNavLinkIcon [class]="item.icon"></i>
                    <span>{{ item.label }}</span>
                </a>
            </li>
        }
    </ul>
</nav>
