<form [formGroup]="anagraficaForm" (ngSubmit)="onSubmit()" class="space-y-6 px-5">

  <!-- Sezione: Informazioni di base -->
  <p-divider>
    <span class="font-semibold">Informazioni di Base</span>
  </p-divider>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label for="nome" class="block mb-2">Nome</label>
      <input id="nome"
        class="w-full border border-solid border-gray-50"
        type="text"
        formControlName="nome" />
    </div>

    <div>
      <label for="cognome" class="block mb-2">Cognome</label>
      <input id="cognome"
        class="w-full"
        type="text"
        formControlName="cognome" />
    </div>

    <div>
      <label for="dataNascita" class="block mb-2">Data di Nascita</label>
      <p-datepicker id="dataNascita"
        class="w-full"
        formControlName="dataNascita"
        dateFormat="dd/mm/yy">
      </p-datepicker>
    </div>

    <div>
      <label for="genere" class="block mb-2">Genere</label>
      <p-select 
          id="genere"
          class="w-full"
          [options] = "generi"
          formControlName="genere" 
          placeholder="Seleziona genere">
      </p-select>
    </div>
</div>

  <!-- Sezione: Contatti -->
  <p-divider>
     <span class="font-semibold">Contatti</span>
    </p-divider>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

    <div>
        <label for="email" class="block mb-2">Email</label>
        <input id="email"
          class="w-full border-solid"
          type="email"
          formControlName="email" />
    </div>

    <div>
      <label for="telefono" class="block mb-2">Telefono</label>
      <input id="telefono"
        class="w-full"
        type="tel"
        formControlName="telefono" />
    </div>
  </div>

  <!-- Sezione: Indirizzo -->
  <p-divider>
    <span class="font-semibold">Indirizzo</span>
  </p-divider>

  <div class="grid grid-cols-1 md:grid-cols-12 gap-4">

    <div class="md:col-span-12">
       <label for="via" class="block mb-2">Via / Indirizzo</label>
            <input
                id="via"
                formControlName="via"
                class="w-full">
        </div>

        <div class="md:col-span-5">
            <label for="citta" class="block mb-2">Città</label>
            <input
                id="citta"
                formControlName="citta"
                class="w-full">
        </div>

        <div class="md:col-span-3">
            <label for="cap" class="block mb-2">CAP</label>
            <input
                id="cap"
                formControlName="cap"
                class="w-full">
        </div>

        <div class="md:col-span-4">
            <label for="provincia" class="block mb-2">Provincia</label>
            <input
                id="provincia"
                formControlName="provincia"
                class="w-full">
        </div>
</div>

  <!-- Pulsante di submit -->
   <div class="flex justify-center">
        <p-button
            type="submit"
            label="Salva"
            severity="primary">
        </p-button>
    </div>

</form>
