<form [formGroup]="anagraficaForm" (ngSubmit)="onSubmit()" class="p-fluid p-formgrid p-grid">

  <!-- Sezione: Informazioni di base -->
  <p-divider align="left" type="dashed">Informazioni di Base</p-divider>

  <div class="p-field p-col-12 p-md-6">
    <label for="nome">Nome</label>
    <input id="nome" type="text" pInputText formControlName="nome" />
  </div>

  <div class="p-field p-col-12 p-md-6">
    <label for="cognome">Cognome</label>
    <input id="cognome" type="text" pInputText formControlName="cognome" />
  </div>

  <div class="p-field p-col-12 p-md-6">
    <label for="dataNascita">Data di Nascita</label>
    <p-calendar id="dataNascita" formControlName="dataNascita" dateFormat="dd/mm/yy"></p-calendar>
  </div>

  <div class="p-field p-col-12 p-md-6">
    <label for="sesso">Sesso</label>
    <p-dropdown 
      id="sesso" 
      [options]="sessi" 
      formControlName="sesso" 
      placeholder="Seleziona sesso">
    </p-dropdown>
  </div>

  <!-- Sezione: Contatti -->
  <p-divider align="left" type="dashed">Contatti</p-divider>

  <div class="p-field p-col-12 p-md-6">
    <label for="email">Email</label>
    <input id="email" type="email" pInputText formControlName="email" />
  </div>

  <div class="p-field p-col-12 p-md-6">
    <label for="telefono">Telefono</label>
    <input id="telefono" type="tel" pInputText formControlName="telefono" />
  </div>

  <!-- Sezione: Indirizzo -->
  <p-divider align="left" type="dashed">Indirizzo</p-divider>

  <div class="p-field p-col-12">
    <label for="via">Via / Indirizzo</label>
    <input id="via" type="text" pInputText formControlName="via" />
  </div>

  <div class="p-field p-col-12 p-md-4">
    <label for="citta">Città</label>
    <input id="citta" type="text" pInputText formControlName="citta" />
  </div>

  <div class="p-field p-col-12 p-md-4">
    <label for="cap">CAP</label>
    <input id="cap" type="text" pInputText formControlName="cap" />
  </div>

  <div class="p-field p-col-12 p-md-4">
    <label for="provincia">Provincia</label>
    <input id="provincia" type="text" pInputText formControlName="provincia" />
  </div>

  <!-- Pulsante di submit -->
  <div class="p-field p-col-12">
    <button pButton type="submit" label="Salva"></button>
  </div>

</form>
