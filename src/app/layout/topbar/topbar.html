<header class="h-16 flex items-center justify-between px-6 bg-surface-0 border-b border-surface-200">
    <!-- Left: Brand / Section Name -->
    <div class="flex items-center gap-2">
        <i class="pi pi-compass text-blue-500 text-lg"></i>
        <h1 class="font-semibold text-lg text-surface-800 m-0">Trading Desk</h1>
    </div>

    <!-- Right: Search, Notifications & User Profile -->
    <div class="flex items-center gap-4">
        <!-- Search Bar -->
        <p-iconfield class="hidden md:block">
            <p-inputicon class="pi pi-search" />
            <input pInputText type="text" placeholder="Search..." aria-label="Search" class="!rounded-full !py-1.5 text-sm w-48" />
        </p-iconfield>
        
        <!-- Notification Bell -->
        <button 
            type="button"
            aria-label="Notifications"
            class="relative p-2 hover:bg-surface-100 rounded-full text-surface-600 transition cursor-pointer">
            <i class="pi pi-bell text-lg"></i>
            <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full"></span>
        </button>
        
        <!-- User Profile Info -->
        <div class="flex items-center gap-3 border-l border-surface-200 pl-4">
            <div class="hidden sm:flex flex-col text-right">
                <span class="text-sm font-medium text-surface-800">Mario Rossi</span>
                <span class="text-xs text-surface-500">Premium Account</span>
            </div>
            <p-avatar label="MR" shape="circle" class="!bg-blue-100 !text-blue-600 font-semibold text-sm" />
        </div>
    </div>
</header>
