<form [formGroup]="anagraficaForm" (ngSubmit)="onSubmit()" class="space-y-6 px-5">

  <!-- Sezione: Informazioni di base -->
  <p-divider>
    <span class="font-bold text-base text-blue-600 dark:text-blue-400">Informazioni di Base</span>
  </p-divider>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label for="nome" class="block mb-2 text-sm font-medium">Nome</label>
      <input id="nome"
        pInputText
        class="w-full border border-gray-300 dark:border-gray-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
        type="text"
        formControlName="nome" />
    </div>

    <div>
      <label for="cognome" class="block mb-2 text-sm font-medium">Cognome</label>
      <input id="cognome"
        pInputText
        class="w-full border border-gray-300 dark:border-gray-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
        type="text"
        formControlName="cognome" />
    </div>

    <div>
      <label for="dataNascita" class="block mb-2 text-sm font-medium">Data di Nascita</label>
      <p-datepicker id="dataNascita"
        class="w-full"
        styleClass="w-full"
        formControlName="dataNascita"
        dateFormat="dd/mm/yy">
      </p-datepicker>
    </div>

    <div>
      <label for="genere" class="block mb-2 text-sm font-medium">Genere</label>
      <p-select 
          id="genere"
          class="w-full"
          styleClass="w-full"
          [options] = "generi"
          formControlName="genere" 
          placeholder="Seleziona genere">
      </p-select>
    </div>
  </div>

  <!-- Sezione: Contatti -->
  <p-divider>
     <span class="font-bold text-base text-blue-600 dark:text-blue-400">Contatti</span>
  </p-divider>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label for="email" class="block mb-2 text-sm font-medium">Email</label>
      <input id="email"
        pInputText
        class="w-full border border-gray-300 dark:border-gray-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
        type="email"
        formControlName="email" />
    </div>

    <div>
      <label for="telefono" class="block mb-2 text-sm font-medium">Telefono</label>
      <input id="telefono"
        pInputText
        class="w-full border border-gray-300 dark:border-gray-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
        type="tel"
        formControlName="telefono" />
    </div>
  </div>

  <!-- Sezione: Indirizzo -->
  <p-divider>
    <span class="font-bold text-base text-blue-600 dark:text-blue-400">Indirizzo</span>
  </p-divider>

  <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
    <div class="md:col-span-12">
      <label for="via" class="block mb-2 text-sm font-medium">Via / Indirizzo</label>
      <input id="via"
        pInputText
        class="w-full border border-gray-300 dark:border-gray-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
        type="text"
        formControlName="via" />
    </div>

    <div class="md:col-span-5">
      <label for="citta" class="block mb-2 text-sm font-medium">Città</label>
      <input id="citta"
        pInputText
        class="w-full border border-gray-300 dark:border-gray-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
        type="text"
        formControlName="citta" />
    </div>

    <div class="md:col-span-3">
      <label for="cap" class="block mb-2 text-sm font-medium">CAP</label>
      <input id="cap"
        pInputText
        class="w-full border border-gray-300 dark:border-gray-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
        type="text"
        formControlName="cap" />
    </div>

    <div class="md:col-span-4">
      <label for="provincia" class="block mb-2 text-sm font-medium">Provincia</label>
      <input id="provincia"
        pInputText
        class="w-full border border-gray-300 dark:border-gray-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
        type="text"
        formControlName="provincia" />
    </div>
  </div>

  <!-- Pulsante di submit -->
  <div class="flex justify-center mt-12 mb-6">
    <p-button
      type="submit"
      label="Salva"
      severity="primary"
      styleClass="w-full md:w-64 py-2.5 text-base font-semibold shadow-md">
    </p-button>
  </div>

</form>
